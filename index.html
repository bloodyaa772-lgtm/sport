<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Форма">
<meta name="theme-color" content="#0B0C0F">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Форма</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@400;500&display=swap">
<style>
/* Layout: одноэкранное приложение под 440×956 pt. Четыре вкладки внизу, каждая прокручивается сама.
   Один акцент (ледяной синий) для тренировок и тела, тёплый тон только для калорий. */
:root{
  --bg:#0B0C0F; --surface:#14161B; --raise:#1D2027; --line:#262A33;
  --fg:#EEF0F3; --mute:#8B919C; --faint:#5A5F6B;
  --accent:#7AA7FF; --accent-ink:#0B0C0F; --accent-soft:#18233A;
  --warm:#FFB36B; --bad:#FF7A7A;
  --display:'Unbounded','Onest',system-ui,sans-serif;
  --body:'Onest',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;overflow:hidden;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.4;padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
input,textarea{font:inherit;color:inherit}
h1,h2,h3,p,ol{margin:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.35;cursor:default}

.shell{position:relative;height:100%;max-width:480px;margin:0 auto}
.view{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;padding:18px 0 150px;scrollbar-width:none}
.view::-webkit-scrollbar{display:none}

@keyframes rise{from{opacity:0;transform:translateY(16px)}}
@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.16)}100%{transform:scale(1)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fade{from{opacity:0}}
@keyframes pulse{50%{transform:scale(1.04)}}
.enter>*{animation:rise .6s cubic-bezier(.2,.8,.2,1) backwards}
.enter>*:nth-child(1){animation-delay:0s}
.enter>*:nth-child(2){animation-delay:.05s}
.enter>*:nth-child(3){animation-delay:.1s}
.enter>*:nth-child(4){animation-delay:.15s}
.enter>*:nth-child(5){animation-delay:.2s}
.enter>*:nth-child(6){animation-delay:.25s}
.enter>*:nth-child(7){animation-delay:.3s}
.enter>*:nth-child(n+8){animation-delay:.35s}

.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:20px}
.eyebrow{font-size:13px;color:var(--mute);margin-bottom:6px}
h1{font-family:var(--display);font-weight:500;font-size:30px;letter-spacing:-.02em;line-height:1.1;text-wrap:balance}
h2{font-size:12px;font-weight:500;color:var(--mute);letter-spacing:.09em;text-transform:uppercase}
.plan{color:var(--mute);font-size:14px;margin:-6px 0 16px}

.demo{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px;color:var(--mute);margin-bottom:16px;padding:6px 6px 6px 14px;border-radius:14px;border:1px dashed var(--line)}
.lnk{color:var(--accent);font-size:13px;min-height:36px;padding:0 10px;border-radius:10px}

.seg{display:flex;gap:6px;background:var(--surface);border-radius:14px;padding:4px;margin-bottom:18px}
.seg button{flex:1;min-height:40px;border-radius:10px;font-size:14px;color:var(--mute);transition:background .3s,color .3s}
.seg button[aria-pressed="true"]{background:var(--raise);color:var(--fg)}

.stats{display:grid;grid-template-columns:repeat(3,1fr);margin-bottom:24px}
.stat{padding:2px 0 2px 14px;border-left:1px solid var(--line);min-width:0}
.stat:first-child{padding-left:0;border-left:0}
.stat b{display:block;font-family:var(--display);font-weight:500;font-size:21px;letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat span{font-size:12px;color:var(--mute)}

.ex{margin-bottom:26px}
.ex-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.ex-h h3{font-size:17px;font-weight:600;min-width:0;overflow-wrap:anywhere}
.ex-h small{color:var(--faint);font-size:12px;white-space:nowrap}
.set{display:grid;grid-template-columns:22px 1fr 12px 1fr 48px;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line)}
.set .n{color:var(--faint);font-size:13px;font-variant-numeric:tabular-nums}
.set .x{color:var(--faint);text-align:center;font-size:13px}
.fld{display:flex;align-items:baseline;gap:6px;background:var(--surface);border-radius:12px;padding:0 12px;min-height:48px;min-width:0;transition:background .3s}
.fld input{width:100%;min-width:0;background:none;border:0;outline:0;font-family:var(--display);font-size:18px;font-weight:500;font-variant-numeric:tabular-nums;padding:10px 0;text-align:right}
.fld i{font-style:normal;font-size:12px;color:var(--mute)}
.chk{width:48px;height:48px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;color:var(--faint);transition:background .25s,border-color .25s,color .25s}
.chk svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.set.done .chk{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);animation:pop .45s}
.set.done .fld{background:var(--accent-soft)}
.ex-f{display:flex;gap:4px;margin-top:2px}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:54px;border-radius:16px;background:var(--accent);color:var(--accent-ink);font-weight:600;width:100%;transition:transform .15s}
.btn:active{transform:scale(.98)}
.btn.sec{background:var(--surface);color:var(--fg)}
.ghost{color:var(--mute);font-size:14px;min-height:40px;padding:0 12px;border-radius:10px}
.ghost:active{background:var(--surface)}
.x-btn{width:40px;height:40px;border-radius:50%;color:var(--faint);display:grid;place-items:center}
.x-btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.row-add{display:flex;gap:8px;margin:4px 0 22px}
.in{width:100%;min-width:0;min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 12px;outline:0;font-size:16px;transition:border-color .2s}
.in:focus{border-color:var(--accent)}
.sq{flex:none;width:48px;height:48px;border-radius:12px;background:var(--raise);display:grid;place-items:center;font-size:22px}
.cta{margin:8px 0 28px}
.hist{display:grid}
.h-row{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:12px 0;border-top:1px solid var(--line)}
.h-row small{color:var(--mute);font-size:12px}
.h-row b{font-weight:500;font-variant-numeric:tabular-nums;text-align:right}
.week{color:var(--mute);font-size:13px;margin:6px 0 4px}
.empty{color:var(--mute);font-size:14px;padding:14px 0}

/* Питание */
.hero{display:grid;grid-template-columns:132px 1fr;gap:22px;align-items:center;margin-bottom:24px}
.ringbox{position:relative;width:132px;height:132px}
.ringbox svg{width:100%;height:100%;transform:rotate(-90deg)}
.ringbox circle{fill:none;stroke-width:9;stroke-linecap:round}
.ringbox .tr{stroke:var(--line)}
.ringbox .pg{stroke:var(--warm);transition:stroke-dashoffset 1.3s cubic-bezier(.2,.8,.2,1)}
.mid{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.mid b{font-family:var(--display);font-weight:500;font-size:21px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.mid span{font-size:11px;color:var(--mute)}
.macros{min-width:0}
.macro{margin-bottom:13px}
.macro:last-child{margin-bottom:0}
.macro-h{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--mute);margin-bottom:6px}
.macro-h b{color:var(--fg);font-weight:500;font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:3px;background:var(--accent);transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.left{color:var(--mute);font-size:14px;margin:-8px 0 18px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:42px;padding:0 15px;border-radius:21px;background:var(--surface);font-size:14px;white-space:nowrap;transition:transform .15s,background .2s}
.chip:active{transform:scale(.95);background:var(--raise)}
.note{font-size:12px;color:var(--faint);margin-bottom:14px}
details.more{margin-bottom:18px}
details.more summary{list-style:none;min-height:44px;display:flex;align-items:center;justify-content:space-between;color:var(--mute);font-size:14px;cursor:pointer;border-top:1px solid var(--line)}
details.more summary::-webkit-details-marker{display:none}
details.more summary::after{content:"+";font-size:20px;color:var(--faint);transition:transform .3s}
details.more[open] summary::after{transform:rotate(45deg)}
.form{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:6px 0 4px}
.form .full{grid-column:1/-1}
.lab{display:grid;gap:4px;font-size:11px;color:var(--mute);min-width:0}
.meal{margin-bottom:18px}
.meal-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}
.mk{font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums}
.item{display:grid;grid-template-columns:1fr auto 40px;gap:8px;align-items:center;padding:8px 0 8px;border-top:1px solid var(--line)}
.item .nm{min-width:0;overflow-wrap:anywhere}
.item small{display:block;color:var(--mute);font-size:12px}
.item .kc{font-variant-numeric:tabular-nums}
.item.new{animation:rise .45s cubic-bezier(.2,.8,.2,1)}

/* Тело */
.wbig{display:grid;grid-template-columns:56px 1fr 56px;align-items:center;gap:8px;margin-bottom:14px}
.rb{width:56px;height:56px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-size:24px;transition:transform .15s,background .2s}
.rb:active{transform:scale(.92);background:var(--raise)}
.wnum{display:flex;align-items:baseline;justify-content:center;gap:6px;min-width:0}
.wnum input{width:5ch;min-width:0;background:none;border:0;outline:0;text-align:center;font-family:var(--display);font-weight:500;font-size:50px;letter-spacing:-.03em;font-variant-numeric:tabular-nums;color:var(--fg)}
.wnum span{color:var(--mute);font-size:15px}
.facts{display:grid;grid-template-columns:repeat(3,1fr);margin:26px 0 22px}
.facts .stat b{font-size:19px}
.facts input{width:100%;min-width:0;background:none;border:0;outline:0;font-family:var(--display);font-weight:500;font-size:19px;color:var(--fg);padding:0}
.goal{margin-bottom:24px}
.goal-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:8px;font-size:14px;color:var(--mute)}
.goal-h label{display:flex;align-items:baseline;gap:6px}
.goal-h input{width:4ch;background:none;border:0;border-bottom:1px solid var(--line);outline:0;color:var(--fg);font-family:var(--display);font-size:15px;text-align:center;padding:2px 0}
.card{background:var(--surface);border-radius:20px;padding:14px 10px 8px;margin-bottom:22px}
.card svg{display:block;width:100%;height:auto}
.gl{stroke:var(--line);stroke-width:1}
.ax{fill:var(--faint);font:10px var(--body)}
.lv{fill:var(--fg);font:500 11px var(--body)}
.ln{fill:none;stroke:var(--accent);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.4s .1s cubic-bezier(.4,0,.2,1) forwards}
.ar{animation:fade .9s .6s backwards}
.dot{fill:var(--accent);animation:fade .4s 1.3s backwards}

/* Связь */
.panel{background:var(--surface);border-radius:20px;padding:18px;margin-bottom:14px}
.panel h3{font-size:17px;font-weight:600;margin-bottom:10px}
.panel>p{color:var(--mute);font-size:14px;margin-bottom:10px}
.steps{padding-left:20px;display:grid;gap:9px;font-size:15px;margin-bottom:14px}
.steps li::marker{color:var(--faint)}
code,.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;background:var(--raise);padding:1px 6px;border-radius:6px;overflow-wrap:anywhere}
.cmds{display:grid;margin-bottom:12px}
.cmds div{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:15px}
.ta{width:100%;min-height:84px;border-radius:12px;border:1px dashed var(--faint);background:var(--bg);padding:12px;outline:0;resize:vertical;font-size:16px}
.ta:focus{border-color:var(--accent)}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.btns .btn{min-height:48px;font-size:15px}

/* Нижняя панель */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:linear-gradient(to top,var(--bg) 62%,transparent)}
.tabs-in{position:relative;max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:4px}
.tabs-in::before{content:"";position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/4);background:var(--raise);border-radius:20px;transform:translateX(calc(var(--i,0)*100%));transition:transform .5s cubic-bezier(.3,1.35,.5,1)}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;font-size:11px;color:var(--mute);transition:color .3s}
.tab svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;transition:transform .4s cubic-bezier(.3,1.5,.5,1)}
.tab[aria-current="page"]{color:var(--fg)}
.tab[aria-current="page"] svg{color:var(--accent);transform:translateY(-1px) scale(1.08)}

.rest{position:fixed;z-index:25;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(84px + env(safe-area-inset-bottom,0px));max-width:448px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:8px 8px 8px 12px;border-radius:22px;background:var(--raise);border:1px solid var(--line);animation:rise .4s cubic-bezier(.2,.8,.2,1)}
.rest svg{width:40px;height:40px;transform:rotate(-90deg);flex:none}
.rest circle{fill:none;stroke-width:3.5;stroke-linecap:round}
.rest .rt{stroke:var(--line)}
.rest .rp{stroke:var(--accent);stroke-dasharray:100.53;stroke-dashoffset:0;transition:stroke-dashoffset .5s linear}
.rest div{flex:1;min-width:0;display:grid;line-height:1.2}
.rest b{font-family:var(--display);font-weight:500;font-size:20px;font-variant-numeric:tabular-nums}
.rest span{font-size:12px;color:var(--mute)}
.rest.done{animation:pulse .6s 2}
.rest.done .rp{stroke:var(--warm)}
.toast{position:fixed;z-index:30;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);max-width:min(420px,calc(100% - 32px));padding:11px 18px;border-radius:18px;background:var(--fg);color:var(--bg);font-size:14px;font-weight:500;text-align:center;opacity:0;pointer-events:none;transition:opacity .3s,transform .4s cubic-bezier(.2,.8,.2,1)}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-delay:0s!important;transition-duration:.001ms!important}
}
</style>
</head>
<body>

<div class="shell">
  <main>
    <section class="view" id="v-train" hidden></section>
    <section class="view" id="v-food" hidden></section>
    <section class="view" id="v-body" hidden></section>
    <section class="view" id="v-sync" hidden></section>
  </main>
</div>

<div class="rest" id="rest" hidden>
  <svg viewBox="0 0 40 40" aria-hidden="true"><circle class="rt" cx="20" cy="20" r="16"/><circle class="rp" id="rp" cx="20" cy="20" r="16"/></svg>
  <div><b id="restT">1:30</b><span>отдых между подходами</span></div>
  <button class="ghost" data-act="rest30" id="rest30">+30 с</button>
  <button class="x-btn" data-act="restx" id="restX" aria-label="Пропустить отдых"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<nav class="tabs" aria-label="Разделы">
  <div class="tabs-in" id="tabs">
    <button class="tab" data-tab="train"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9.5v5M6.5 7v10M17.5 7v10M21 9.5v5M6.5 12h11"/></svg>Тренировка</button>
    <button class="tab" data-tab="food"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="3.5"/></svg>Питание</button>
    <button class="tab" data-tab="body"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="5"/><path d="M8.5 9.5a5 5 0 0 1 7 0M12 13.2l2.2-2.6"/></svg>Тело</button>
    <button class="tab" data-tab="sync"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 0 0-14-4M4 13a8 8 0 0 0 14 4M6 3v4h4M18 21v-4h-4"/></svg>Siri</button>
  </div>
</nav>

<script>
(function(){
'use strict';
var KEY='forma.v1';
var REDUCED=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
var $=function(s,r){return (r||document).querySelector(s)};
var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
var pad=function(n){return String(n).padStart(2,'0')};
var dkey=function(d){d=d||new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
var fmt=function(n,d){return Number(n).toFixed(d==null?1:d).replace('.',',')};
var thou=function(n){return Math.round(n).toLocaleString('ru-RU')};
var plural=function(n,f){n=Math.abs(n)%100;var m=n%10;return n>10&&n<20?f[2]:m>1&&m<5?f[1]:m===1?f[0]:f[2]};
var esc=function(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var num=function(s){var v=parseFloat(String(s).replace(',','.'));return isFinite(v)?v:NaN};
var uid=function(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)};
var cap=function(s){return s.charAt(0).toUpperCase()+s.slice(1)};
var vib=function(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}};
var DAY_MS=864e5;

var ICON_CHECK='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
var ICON_X='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>';

var DAYS=[
 {id:'push',tab:'Грудь',name:'Грудь и трицепс',ex:[
  ['Жим лёжа',[[60,8],[60,8],[60,8],[60,8]]],
  ['Жим гантелей на наклонной',[[22,10],[22,10],[22,10]]],
  ['Разведение в кроссовере',[[15,12],[15,12],[15,12]]],
  ['Французский жим',[[25,10],[25,10],[25,10]]]]},
 {id:'pull',tab:'Спина',name:'Спина и бицепс',ex:[
  ['Тяга верхнего блока',[[50,10],[50,10],[50,10],[50,10]]],
  ['Тяга штанги в наклоне',[[50,8],[50,8],[50,8]]],
  ['Тяга гантели одной рукой',[[24,10],[24,10],[24,10]]],
  ['Подъём штанги на бицепс',[[30,10],[30,10],[30,10]]]]},
 {id:'legs',tab:'Ноги',name:'Ноги и плечи',ex:[
  ['Приседания со штангой',[[70,8],[70,8],[70,8],[70,8]]],
  ['Румынская тяга',[[60,10],[60,10],[60,10]]],
  ['Жим ногами',[[120,12],[120,12],[120,12]]],

/* ---------- общие помощники ---------- */
function setNum(el,to,dec,ms){
  if(!el)return;
  dec=dec||0;ms=ms||800;
  var from=el._v||0;el._v=to;
  var f=function(v){return dec?fmt(v,dec):thou(v)};
  if(el._r)cancelAnimationFrame(el._r);
  if(REDUCED||from===to){el.textContent=f(to);return}
  var t0=performance.now();
  var step=function(t){
    var p=Math.min(1,(t-t0)/ms),e=1-Math.pow(1-p,3);
    el.textContent=f(from+(to-from)*e);
    if(p<1)el._r=requestAnimationFrame(step);
  };
  el._r=requestAnimationFrame(step);
}
function put(id,html,enter){
  var v=$('#v-'+id);
  v.classList.remove('enter');
  v.innerHTML=html;
  if(enter){void v.offsetWidth;v.classList.add('enter')}
}

  var s=Math.max(0,Math.floor(ms/1000)),h=Math.floor(s/3600),m=Math.floor(s%3600/60);
  return (h?h+':'+pad(m):m)+':'+pad(s%60);
}

/* ---------- тренировка ---------- */
function buildSession(dayId){
  var day=DAYS.filter(function(d){return d.id===dayId})[0];
  return {dayId:day.id,name:day.name,startedAt:0,ex:day.ex.map(function(e){
    return {n:e[0],sets:e[1].map(function(s){var l=S.lastW[e[0]];return {w:l?l[0]:s[0],r:l?l[1]:s[1],done:0}})};
  })};
}
function ensureSession(){
  var s=S.session;
  if(s&&s.startedAt&&Date.now()-s.startedAt>18*36e5)s=S.session=null;
  if(!s){
    var last=S.sessions.slice().sort(function(a,b){return a.ts-b.ts}).pop();
    var idx=last?(DAYS.map(function(d){return d.id}).indexOf(last.dayId)+1)%DAYS.length:0;
    s=S.session=buildSession(DAYS[idx].id);
  }
  return s;
}
function sums(s){
  var vol=0,done=0,total=0;
  s.ex.forEach(function(e){e.sets.forEach(function(x){total++;if(x.done){done++;vol+=x.w*x.r}})});
  return {vol:vol,done:done,total:total};
}
function setRow(e,i,st,x){
  return '<div class="set'+(x.done?' done':'')+'" data-e="'+e+'" data-s="'+i+'">'+

    '<label class="fld"><input class="w" id="w-'+e+'-'+i+'" inputmode="decimal" value="'+String(x.w).replace('.',',')+'" aria-label="Вес, кг"><i>кг</i></label>'+

    '<label class="fld"><input class="r" id="r-'+e+'-'+i+'" inputmode="numeric" value="'+x.r+'" aria-label="Повторы"><i>повт</i></label>'+
    '<button class="chk" data-act="chk" aria-label="Подход выполнен" aria-pressed="'+(x.done?'true':'false')+'">'+ICON_CHECK+'</button></div>';
}
function weekCount(){
  var from=Date.now()-7*DAY_MS;
  return S.sessions.filter(function(x){return x.ts>=from}).length;
}

     '<div class="stat"><b id="sTime">'+(locked?clock(Date.now()-s.startedAt):'—')+'</b><span>время</span></div></div>';
  s.ex.forEach(function(e,ei){

function toggleSet(row){
  var s=S.session,e=+row.dataset.e,i=+row.dataset.s,x=s.ex[e].sets[i];
  x.done=x.done?0:1;

  row.classList.toggle('done',!!x.done);
  var b=$('.chk',row);b.setAttribute('aria-pressed',x.done?'true':'false');
  save();updTrain();

function finish(){
  var s=S.session,t=sums(s);
  if(!t.done){S.session=null;stopRest();save();renderTrain(false);toast('Нет выполненных подходов, тренировка не сохранена');return}
  var min=Math.max(1,Math.round((Date.now()-s.startedAt)/60000));
  S.sessions.push({ts:Date.now(),dayId:s.dayId,name:s.name,vol:t.vol,sets:t.done,min:min});
  s.ex.forEach(function(e){
    var d=e.sets.filter(function(x){return x.done});
    if(d.length){var l=d[d.length-1];S.lastW[e.n]=[l.w,l.r]}
  });
  S.session=null;stopRest();save();renderTrain(false);
  vib([20,40,20]);
  toast('Готово: '+thou(t.vol)+' кг за '+min+' мин');
}

function stopRest(){clearTimeout(restHide);rest=null;var el=$('#rest');el.hidden=true;el.classList.remove('done')}
function restTick(){
  if(!rest)return;
  var el=$('#rest'),left=(rest.end-Date.now())/1000;
  if(left<=0){
    if(!el.classList.contains('done')){
      el.classList.add('done');$('#restT').textContent='Пора';vib([30,70,30]);
      restHide=setTimeout(stopRest,3500);
    }
    $('#rp').style.strokeDashoffset=RC;return;
  }
  var s=Math.ceil(left);
  $('#restT').textContent=Math.floor(s/60)+':'+pad(s%60);
  $('#rp').style.strokeDashoffset=String(RC*(1-left/rest.total));
}

function weights(){return S.weights.slice().sort(function(a,b){return a.d<b.d?-1:a.d>b.d?1:0})}
function curW(){var w=weights();return w.length?w[w.length-1].kg:null}
function logWeight(kg){
  kg=Math.round(kg*10)/10;
  if(!(kg>20&&kg<400))return false;
  var d=dkey(),e=S.weights.filter(function(x){return x.d===d})[0];
  if(e){e.kg=kg;delete e.demo}else S.weights.push({d:d,kg:kg});
  save();return true;
}
function pace(){
  var w=weights().filter(function(x){return Date.parse(x.d)>=Date.now()-28*DAY_MS});
  if(w.length<2)return null;
  var days=(Date.parse(w[w.length-1].d)-Date.parse(w[0].d))/DAY_MS;
  if(days<6)return null;
  return (w[w.length-1].kg-w[0].kg)/days*7;
}
function bmiInfo(){
  var w=curW();
  if(!w||!S.height)return null;
  var b=w/Math.pow(S.height/100,2);
  var l=b<18.5?'дефицит массы':b<25?'норма':b<30?'избыток массы':'ожирение';
  return {v:b,l:l};
}
function chartHTML(){
  var all=weights().slice(-30);
  if(all.length<2)return '<div class="card"><p class="empty" style="padding:14px 8px">Запишите вес минимум два раза, и здесь появится график.</p></div>';
  var W=360,H=176,L=38,R=14,T=26,B=28;
  var ks=all.map(function(x){return x.kg});
  var lo=Math.floor((Math.min.apply(null,ks)-.2)*2)/2,hi=Math.ceil((Math.max.apply(null,ks)+.2)*2)/2;
  if(hi-lo<1)hi=lo+1;
  if(((hi-lo)*2)%2)hi+=.5;
  var t0=Date.parse(all[0].d),t1=Date.parse(all[all.length-1].d),span=Math.max(1,t1-t0);
  var X=function(d){return L+(Date.parse(d)-t0)/span*(W-L-R)};
  var Y=function(k){return T+(1-(k-lo)/(hi-lo))*(H-T-B)};
  var pts=all.map(function(x){return [X(x.d),Y(x.kg)]});
  var line=pts.map(function(p,i){return (i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)}).join(' ');
  var last=pts[pts.length-1],first=pts[0];
  var area=line+' L'+last[0].toFixed(1)+' '+(H-B)+' L'+first[0].toFixed(1)+' '+(H-B)+' Z';
  var grid=[lo,(lo+hi)/2,hi].map(function(v){
    return '<line class="gl" x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(v).toFixed(1)+'" y2="'+Y(v).toFixed(1)+'"/><text class="ax" x="'+(L-7)+'" y="'+(Y(v)+3.5).toFixed(1)+'" text-anchor="end">'+(v%1?fmt(v,1):fmt(v,0))+'</text>';
  }).join('');
  var dl=function(d){var p=d.split('-');return new Intl.DateTimeFormat('ru-RU',{day:'numeric',month:'short'}).format(new Date(+p[0],+p[1]-1,+p[2])).replace('.','')};
  return '<div class="card"><svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="График веса за последние записи">'+
    '<defs><linearGradient id="gw" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--accent);stop-opacity:.28"/><stop offset="1" style="stop-color:var(--accent);stop-opacity:0"/></linearGradient></defs>'+
    grid+'<path class="ar" d="'+area+'" fill="url(#gw)" stroke="none"/>'+
    '<path class="ln" pathLength="1" d="'+line+'"/>'+
    '<circle class="dot" cx="'+last[0].toFixed(1)+'" cy="'+last[1].toFixed(1)+'" r="4.5"/>'+
    '<text class="lv" x="'+last[0].toFixed(1)+'" y="'+(last[1]-10).toFixed(1)+'" text-anchor="end">'+fmt(all[all.length-1].kg,1)+' кг</text>'+
    '<text class="ax" x="'+L+'" y="'+(H-8)+'" text-anchor="start">'+dl(all[0].d)+'</text>'+
    '<text class="ax" x="'+(W-R)+'" y="'+(H-8)+'" text-anchor="end">'+dl(all[all.length-1].d)+'</text>'+
    '</svg></div>';
}
function bodyHTML(){
  var w=curW(),b=bmiInfo(),p=pace(),ws=weights();
  var h=demoBanner();
  h+='<header class="top"><div><p class="eyebrow">'+dateLabel()+'</p><h1>Тело</h1></div></header>';
  h+='<div class="wbig"><button class="rb" data-act="wd" data-d="-0.1" aria-label="Минус 0,1 кг">−</button>'+
     '<label class="wnum"><input id="wIn" inputmode="decimal" value="'+(w?fmt(w,1):'')+'" placeholder="0,0" aria-label="Вес, кг"><span>кг</span></label>'+
     '<button class="rb" data-act="wd" data-d="0.1" aria-label="Плюс 0,1 кг">+</button></div>';
  h+='<button class="btn" data-act="wlog">Записать вес</button>';
  h+='<div class="facts">'+
     '<div class="stat"><input id="hIn" inputmode="numeric" value="'+(S.height||'')+'" placeholder="—" aria-label="Рост, см"><span>рост, см</span></div>'+
     '<div class="stat"><b>'+(b?fmt(b.v,1):'—')+'</b><span>ИМТ'+(b?', '+b.l:'')+'</span></div>'+
     '<div class="stat"><b>'+(p==null?'—':(p>0?'+':p<0?'−':'')+fmt(Math.abs(p),2))+'</b><span>кг в неделю</span></div></div>';
  var goalPct=0,toGo='';
  if(S.goal&&w&&ws.length){
    var start=ws[0].kg;
    goalPct=start===S.goal?1:Math.max(0,Math.min(1,(w-start)/(S.goal-start)));
    var d=S.goal-w;
    toGo=Math.abs(d)<.05?'Цель достигнута':(d>0?'Осталось набрать ':'Осталось сбросить ')+fmt(Math.abs(d),1)+' кг';
  }
  h+='<section class="goal"><div class="goal-h"><label>Цель <input id="gIn" inputmode="decimal" value="'+(S.goal?fmt(S.goal,1):'')+'" placeholder="—" aria-label="Целевой вес, кг"> кг</label><span id="toGo">'+toGo+'</span></div>'+
     '<div class="bar"><i id="gBar"></i></div></section>';
  h+=chartHTML();
  h+='<section><h2>Записи</h2>';
  var rows=ws.slice(-6).reverse();
  if(!rows.length)h+='<p class="empty">Пока нет записей.</p>';
  else h+='<div class="hist">'+rows.map(function(x){
    var p=x.d.split('-'),d=new Intl.DateTimeFormat('ru-RU',{weekday:'short',day:'numeric',month:'long'}).format(new Date(+p[0],+p[1]-1,+p[2]));
    return '<div class="item" style="grid-template-columns:1fr auto 40px"><span>'+d+'</span><b style="font-weight:500">'+fmt(x.kg,1)+' кг</b><button class="x-btn" data-act="delw" data-d="'+x.d+'" aria-label="Удалить запись">'+ICON_X+'</button></div>';
  }).join('')+'</div>';
  h+='</section>';
  S._gp=goalPct;
  return h;
}
function renderBody(enter){
  put('body',bodyHTML(),enter);
  var g=S._gp;delete S._gp;
  var bar=$('#gBar');
  if(bar)requestAnimationFrame(function(){requestAnimationFrame(function(){bar.style.width=(g*100)+'%'})});
}

/* ---------- Siri и Здоровье ---------- */

  var h='<header class="top"><div><p class="eyebrow">Команды Apple</p><h1>Siri и Здоровье</h1></div></header>';
  h+='<p class="plan" style="margin-top:0">Страница сама не говорит с Siri и Здоровьем: Apple открывает их только через приложение «Команды». Настройка занимает около трёх минут.</p>';
  h+='<section class="panel"><h3>Здоровье → Форма</h3><ol class="steps">'+
     '<li>Команды → «+» → «Найти образцы здоровья»: тип «Вес», сортировка по дате, сначала новые, лимит 1.</li>'+
     '<li>Добавьте такое же действие с типом «Рост».</li>'+
     '<li>Действие «Текст»: <code>вес=</code> значение первого образца, затем <code>;рост=</code> значение второго.</li>'+
     '<li>Действие «Скопировать в буфер обмена».</li>'+
     '<li>Запустите команду, вернитесь сюда и вставьте текст в поле.</li></ol>'+
     '<textarea class="ta" id="pasteH" placeholder="Вставьте: вес=82,4 кг;рост=181 см" aria-label="Данные из Здоровья"></textarea></section>';
  h+='<section class="panel"><h3>Форма → Здоровье</h3><ol class="steps">'+
     '<li>Нажмите «Скопировать вес» ниже.</li>'+
     '<li>В «Командах»: «Получить буфер обмена» → «Записать образец здоровья», тип «Вес», единица «кг».</li></ol>'+
     '<button class="btn sec" data-act="copy-weight">Скопировать вес</button></section>';
  h+='<section class="panel"><h3>Голосовые команды</h3><ol class="steps">'+
     '<li>«Команды» → «+» → «Открыть URL».</li>'+
     '<li>В поле URL вставьте ссылку на эту страницу и допишите суффикс из списка.</li>'+
     '<li>Название команды и есть фраза для Siri: «Привет, Siri, Тренировка».</li></ol>'+
     '<div class="cmds"><div><span>Тренировка</span><code>#train</code></div><div><span>Питание</span><code>#food</code></div><div><span>Вес</span><code>#body</code></div>'+
     '<div><span>Записать вес</span><code>#w82.4</code></div><div><span>Записать калории</span><code>#k500</code></div></div>'+
     '<p>Для двух последних перед «Открыть URL» добавьте «Запросить ввод» (тип «Число») и «Заменить текст» (запятая на точку). Число подставьте сразу после <code>#w</code> или <code>#k</code>.</p></section>';
  h+='<section class="panel"><h3>На экран «Домой»</h3><ol class="steps"><li>Откройте страницу в Safari.</li><li>Поделиться → «На экран “Домой”».</li></ol></section>';
  h+='<section class="panel"><h3>Резервная копия</h3><p>Данные хранятся в Safari на этом iPhone. Скопируйте копию и сохраните в заметках.</p>'+
     '<div class="btns"><button class="btn sec" data-act="copy-backup">Скопировать копию</button><button class="btn sec" data-act="clear-all">Сбросить всё</button></div>'+
     '<textarea class="ta" id="pasteB" placeholder="Вставьте копию для восстановления" aria-label="Восстановление из копии"></textarea></section>';

function renderSync(enter){put('sync',syncHTML(),enter)}

function parseHealth(t){
  var out={},m;
  t=String(t).replace(/ /g,' ');
  m=/вес\s*[=:]?\s*([0-9]+(?:[.,][0-9]+)?)/i.exec(t);
  if(m)out.w=num(m[1]);
  m=/рост\s*[=:]?\s*([0-9]+(?:[.,][0-9]+)?)/i.exec(t);
  if(m){var hh=num(m[1]);if(hh<3)hh*=100;if(hh>=80&&hh<=250)out.h=Math.round(hh)}
  return out;
}
function importHealth(text){
  var o=parseHealth(text),msg=[];
  if(o.w&&logWeight(o.w))msg.push('вес '+fmt(o.w,1)+' кг');
  if(o.h){S.height=o.h;S.dh=0;msg.push('рост '+o.h+' см')}
  if(!msg.length){toast('Не нашёл вес или рост. Формат: вес=82,4 кг;рост=181 см');return}
  save();toast('Сохранено: '+msg.join(' и '));
}

/* ---------- маршрут и вкладки ---------- */
var VIEWS=['train','food','body','sync'],cur=null,pending=null;
var render={train:renderTrain,food:renderFood,body:renderBody,sync:renderSync};
function go(name){
  cur=name;
  $('#tabs').style.setProperty('--i',VIEWS.indexOf(name));
  $$('.tab').forEach(function(t){
    if(t.dataset.tab===name)t.setAttribute('aria-current','page');else t.removeAttribute('aria-current');
  });
  VIEWS.forEach(function(v){
    var el=$('#v-'+v);
    if(v===name){el.hidden=false;render[v](true);el.scrollTop=0}else el.hidden=true;
  });
}
function route(){
  var h=(location.hash||'').replace('#','').toLowerCase(),m;
  if(VIEWS.indexOf(h)>-1)return h;
  var fresh=!(S.lh&&S.lh.h===h&&Date.now()-S.lh.t<45000);
  if((m=/^w(\d{2,3}(?:\.\d)?)$/.exec(h))){
    if(fresh){S.lh={h:h,t:Date.now()};if(logWeight(parseFloat(m[1])))pending='Вес '+fmt(parseFloat(m[1]),1)+' кг записан';save()}
    return 'body';
  }
  if((m=/^k(\d{2,4})$/.exec(h))){
    if(fresh){S.lh={h:h,t:Date.now()};todayFood().push({id:uid(),m:foodMeal,n:'Быстрая запись',k:+m[1],p:0,f:0,c:0});pending=m[1]+' ккал добавлено';save()}
    return 'food';
  }
  return 'train';
}

/* ---------- события ---------- */
document.addEventListener('click',function(ev){
  var tab=ev.target.closest('[data-tab]');
  if(tab){if(tab.dataset.tab!==cur)go(tab.dataset.tab);else $('#v-'+cur).scrollTo({top:0,behavior:'smooth'});return}
  var b=ev.target.closest('[data-act]');
  if(!b)return;
  var a=b.dataset.act,s=S.session;
  switch(a){
    case 'day':
      if(!s||!s.startedAt){S.session=buildSession(b.dataset.day);save();renderTrain(false)}
      break;
    case 'chk':toggleSet(b.closest('.set'));break;
    case 'addset':{
      var ex=s.ex[+b.dataset.e],l=ex.sets[ex.sets.length-1]||{w:20,r:10};
      ex.sets.push({w:l.w,r:l.r,done:0});save();renderTrain(false);break}
    case 'rmset':{
      var ex2=s.ex[+b.dataset.e];if(ex2.sets.length>1){ex2.sets.pop();save();renderTrain(false)}break}
    case 'delex':s.ex.splice(+b.dataset.e,1);save();renderTrain(false);break;
    case 'start':s.startedAt=Date.now();save();vib(12);renderTrain(false);break;
    case 'finish':finish();break;
    case 'rest30':if(rest){rest.end+=30000;rest.total+=30;$('#rest').classList.remove('done');clearTimeout(restHide);restTick()}break;
    case 'restx':stopRest();break;
    case 'meal':foodMeal=b.dataset.m;$$('#meals button').forEach(function(x){x.setAttribute('aria-pressed',String(x.dataset.m===foodMeal))});break;
    case 'preset':{var p=PRESETS[+b.dataset.p];addFood(p[0],p[1],p[2],p[3],p[4]);break}
    case 'delfood':{var k=dkey();S.food[k]=todayFood().filter(function(x){return x.id!==b.dataset.id});save();refreshFood();break}
    case 'wd':{
      var inp=$('#wIn'),v=num(inp.value);if(isNaN(v))v=curW()||70;
      v=Math.round((v+parseFloat(b.dataset.d))*10)/10;inp.value=fmt(v,1);vib(8);break}
    case 'wlog':{
      var val=num($('#wIn').value);
      if(logWeight(val)){vib(14);renderBody(false);toast('Вес '+fmt(val,1)+' кг записан')}
      else toast('Введите вес в килограммах');break}
    case 'delw':S.weights=S.weights.filter(function(x){return x.d!==b.dataset.d});save();renderBody(false);break;
    case 'clear-demo':
      S.weights=S.weights.filter(function(x){return !x.demo});
      S.sessions=S.sessions.filter(function(x){return !x.demo});
      Object.keys(S.food).forEach(function(d){S.food[d]=S.food[d].filter(function(x){return !x.demo})});
      if(S.dh)S.height=null;if(S.dg)S.goal=null;
      S.demo=0;save();render[cur](false);toast('Примеры удалены');break;
    case 'copy-weight':{var cw=curW();if(cw)copyText(String(cw),'Вес скопирован');else toast('Сначала запишите вес');break}
    case 'copy-backup':{var c=JSON.parse(JSON.stringify(S));delete c._gp;copyText(JSON.stringify(c),'Копия скопирована');break}
    case 'clear-all':
      if(b.dataset.sure){S=seed();S.demo=0;S.weights=[];S.sessions=[];S.food={};S.height=null;S.goal=null;S.dh=0;S.dg=0;save();stopRest();renderSync(false);toast('Всё очищено')}
      else{b.dataset.sure='1';b.textContent='Нажмите ещё раз';setTimeout(function(){b.dataset.sure='';b.textContent='Сбросить всё'},3000)}
      break;
  }
});
document.addEventListener('input',function(ev){
  var t=ev.target,row=t.closest&&t.closest('.set');
  if(row&&S.session&&(t.classList.contains('w')||t.classList.contains('r'))){
    var x=S.session.ex[+row.dataset.e].sets[+row.dataset.s],v=num(t.value);
    x[t.classList.contains('w')?'w':'r']=(!isNaN(v)&&v>=0)?v:0;
    save();updTrain();
  }
});
document.addEventListener('change',function(ev){
  var t=ev.target;
  if(t.dataset&&t.dataset.g){var v=num(t.value);if(v>0){S.goals[t.dataset.g]=v;save();refreshFood()}}
  else if(t.id==='hIn'){var h=num(t.value);if(h>=80&&h<=250){S.height=Math.round(h);S.dh=0;save();renderBody(false)}}
  else if(t.id==='gIn'){var g=num(t.value);if(g>20&&g<400){S.goal=g;S.dg=0;save();renderBody(false)}}
});
document.addEventListener('submit',function(ev){
  ev.preventDefault();
  var f=ev.target;
  if(f.id==='exForm'){
    var n=$('#exName').value.trim();if(!n)return;
    var l=S.lastW[n]||[20,10];
    S.session.ex.push({n:n,sets:[0,1,2].map(function(){return {w:l[0],r:l[1],done:0}})});
    save();renderTrain(false);
  }else if(f.id==='foodForm'){
    var k=num($('#fK2').value);
    if(isNaN(k)||k<=0){toast('Укажите калории');return}
    var z=function(id){var v=num($(id).value);return isNaN(v)?0:v};
    addFood($('#fName').value.trim()||'Блюдо',k,z('#fP'),z('#fF'),z('#fC'));
    f.reset();
  }
});
document.addEventListener('paste',function(ev){
  var t=ev.target;
  if(!t||!t.id)return;
  var text=(ev.clipboardData||window.clipboardData).getData('text');
  if(t.id==='pasteH'){
    ev.preventDefault();importHealth(text);t.value='';
  }else if(t.id==='pasteB'){
    ev.preventDefault();
    try{
      var o=JSON.parse(text);
      if(!o||o.v!==1||!Array.isArray(o.weights))throw 0;
      S=o;save();t.value='';toast('Данные восстановлены');
    }catch(e){toast('Это не похоже на копию из «Формы»')}
  }
});
window.addEventListener('hashchange',function(){var r=route();go(r);if(pending){toast(pending);pending=null}});

/* ---------- старт ---------- */
var first=route();
go(first);
if(pending){var pm=pending;pending=null;setTimeout(function(){toast(pm)},500)}
})();
</script>
